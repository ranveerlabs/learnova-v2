<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Learnova">
  <title>Learnova</title>
  <desc>
    The monitor that sits in the corner of the app, drawn cell by cell off the
    same fifteen by fourteen grid as the CRT sprite in app/paper.tsx. Change one
    and change the other.

    #bebebe is the supply metal, #2f2f2f the supply graphite and #7cc9a6 the
    supply mint, all three in app/globals.css. The ground is the desktop the
    windows sit on.

    The ground is painted rather than left transparent, because a favicon sits
    on whatever the browser's tab strip happens to be. Square, since nothing in
    this theme is rounded.

    (No XML comments in here: a double hyphen is illegal inside one, and every
    token name in this app has two.)
  </desc>

