<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Learnova">
  <title>Learnova</title>
  <desc>
    Two chevrons around a star, drawn cell by cell off the same nine row grid
    as the LOGO sprite in app/paper.tsx. Change one and change the other.

    #f5c243 is the supply gold, the same gold as the stars pinned around Round
    Mode's front door, and it is in app/globals.css. #101010 is the ink and
    #fdfcdf the cream.

    The ground is painted rather than left transparent. A favicon sits on
    whatever the browser's tab strip happens to be, and dark chevrons on a dark
    tab are invisible ones. Square, because nothing in this theme is rounded.

    (No XML comments in here: a double hyphen is illegal inside one, and every
    token name in this app has two.)
  </desc>

